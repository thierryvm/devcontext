# Continuous integration for DevContext.
#
# Windows only, and that is not a shortcut. This module manipulates the Windows
# user PATH, the HKCU registry, DPAPI-encrypted VS Code stores and git-bash --
# there is nothing here another runner could meaningfully verify.
#
# The suite is split into three jobs rather than one, so a red build says WHICH
# property broke. A single job reporting "tests failed" makes you read a log to
# learn what a job name could have told you.
#
# The Pester job itself lives in suite.yml and is CALLED from here, because the
# release needs the same suite and a second copy of it is what broke the first
# release. Preparing an environment lives in .github/actions/prepare-powershell
# for the same reason.

name: CI

on:
  push:
    branches: [main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pester suite
    uses: ./.github/workflows/suite.yml
    with:
      # CI reports on every language rather than stopping at the first: here the
      # useful answer is the full extent of the breakage, not its existence.
      fail-fast: false
      timeout-minutes: 15

  manifest:
    name: Manifest and module load
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # This also proves the manifest RESOLVES here, which is the half that
      # Test-ModuleManifest performs and Import-PowerShellDataFile does not.
      - uses: ./.github/actions/prepare-powershell

      - name: The manifest carries what the Gallery demands
        shell: pwsh
        run: |
          # Resolution is settled by the preparation above. What is left is
          # publishability, which is a different question: the Gallery refuses a
          # submission with no description, and that description is the first
          # sentence someone reads who has never heard of this module.
          $m = Test-ModuleManifest ./DevContext.psd1
          "Module {0} version {1}" -f $m.Name, $m.Version
          if (-not $m.Description) { throw 'Description is required to publish' }

      - name: The module imports on a machine that has never seen it
        shell: pwsh
        run: |
          Import-Module ./DevContext.psd1 -Force -ErrorAction Stop
          $mod = Get-Module DevContext
          "Functions: {0}" -f $mod.ExportedFunctions.Count
          "Aliases:   {0}" -f $mod.ExportedAliases.Count
          if ($mod.ExportedFunctions.Count -lt 10) { throw 'Export list looks truncated' }

  secrets:
    name: No credential in the repository
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the full history, not just the tip
        shell: pwsh
        run: |
          # A credential removed in a later commit is still published: the
          # working tree is clean and the history is not. This is the check
          # the local suite cannot perform on a shallow clone.
          #
          # The patterns come from tools/Assert-Release.ps1 -- ONE list, read by
          # both scanners. This job scans the HISTORY and the release audit scans
          # the PACKAGE: different inputs, different allowlists, but keeping two
          # copies of the patterns is the "derive one list, hand-copy its twin"
          # trap this repository has already paid for once, on the ctx-* aliases.
          . ./tools/Assert-Release.ps1 -AsLibrary
          $motifs = Get-CtxMotifsSecrets
          $historique = git log --all -p
          $fautes = @()
          foreach ($m in $motifs) {
            $trouves = $historique | Select-String -Pattern $m -AllMatches
            foreach ($t in $trouves) { $fautes += $t.Matches.Value }
          }
          # The test fixtures are deliberately obvious and deliberately fake.
          # Prefixes only, kept SHORT on purpose: writing a full key-shaped
          # string here -- even a public documentation example -- makes this
          # very file trip the repository's own secret scan. It did, once.
          $fixtures = @('sbp_010203', 'ghp_AAAA', 'ghp_16Chars', 'github_pat_11ABCDEFG',
                        'sk-proj-abcdef', 'xoxb-123456', 'AKIAIOSFODNN')
          $fautes = $fautes | Where-Object {
            $valeur = $_
            -not ($fixtures | Where-Object { $valeur.StartsWith($_) })
          }
          if ($fautes) {
            $fautes | Sort-Object -Unique | ForEach-Object { Write-Host "::error::possible credential in history: $_" }
            throw "$($fautes.Count) credential-shaped string(s) found in history"
          }
          Write-Host 'History is clean.'
