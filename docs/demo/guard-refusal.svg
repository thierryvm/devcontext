  <text class='m' x='78' y='20' fill='#6b7280' font-size='12'>git-bash  -  no context loaded</text>
  <text class='m l0' x='18' y='52' fill='#d7dae0'>$ cd ~/projects/demo-app</text>
  <text class='m l1' x='18' y='73' fill='#d7dae0'>$ echo $DEVCTX          # no context loaded at all</text>
  <text class='m l2' x='18' y='94' fill='#6b7280'></text>
  <text class='m l3' x='18' y='115' fill='#d7dae0'>$ supabase db reset --linked</text>
  <text class='m l4' x='18' y='136' fill='#6b7280'></text>
  <text class='m l5' x='18' y='157' fill='#f87171'>  REFUSED - DevContext production guard</text>
  <text class='m l6' x='18' y='178' fill='#6b7280'></text>
  <text class='m l7' x='18' y='199' fill='#fbbf24'>    Target : demo-app-prod</text>
  <text class='m l8' x='18' y='220' fill='#d7dae0'>    Reason : 'db reset' drops and recreates the</text>
  <text class='m l9' x='18' y='241' fill='#d7dae0'>             database. Refused on production.</text>
  <text class='m l10' x='18' y='262' fill='#6b7280'></text>
  <text class='m l11' x='18' y='283' fill='#d7dae0'>$ echo $?</text>
  <text class='m l12' x='18' y='304' fill='#d7dae0'>1</text>
  <text class='m l13' x='18' y='325' fill='#6b7280'></text>
  <text class='m l14' x='18' y='346' fill='#6b7280'># The real CLI was never reached.</text>
