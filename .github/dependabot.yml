# Le module n'a pas de dépendances npm ni NuGet : la seule surface qui vieillit
# est celle des actions GitHub. Une action épinglée sur une version majeure
# obsolète est un vecteur d'exécution dans la CI, pas un détail cosmétique.
version: 2
updates:
  - package-ecosystem: github-actions
    # Deux emplacements, parce que « / » ne couvre que .github/workflows. Une
    # action composite vit ailleurs, et une dépendance que personne ne surveille
    # est exactement celle qui vieillit sans le dire.
    directories:
      - /
      - /.github/actions/prepare-powershell
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
