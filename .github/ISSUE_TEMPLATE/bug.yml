name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a token**, even a revoked one. Redact it.
        For a security vulnerability, stop here and use the Security tab instead
        — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: diagnostic
    attributes:
      label: Output of ctx-doctor
      description: |
        Run `ctx-doctor` in the folder where the problem happens and paste the
        output. It reports no credential values — only the names of the keys
        holding them.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Exact commands to reproduce
      description: From a fresh terminal, including the `work` call.
      render: powershell
      placeholder: |
        work perso -NoCd
        cd F:\PROJECTS\Apps\mon-projet
        supabase db push
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Module version
      description: "`(Get-Module DevContext -ListAvailable).Version`"
    validations:
      required: true

  - type: input
    id: shell
    attributes:
      label: Shell used
      description: PowerShell, cmd.exe, git-bash, WSL, an AI agent's shell…
      placeholder: git-bash
    validations:
      required: true

  - type: input
    id: pwsh
    attributes:
      label: PowerShell version
      description: "`$PSVersionTable.PSVersion`"
    validations:
      required: true
